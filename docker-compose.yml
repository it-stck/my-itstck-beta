services:
  # ----------------------------------------------------------------------------
  # 1. Web Application Service (Node.js 22 / Express / Vite Frontend)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itstack-web
    restart: unless-stopped
    ports:
      # Exposed directly on the VPS host IP on port 3000
      - "0.0.0.0:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=${APP_URL:-http://localhost:3000}
      - DATABASE_URL=postgres://${POSTGRES_USER:-itstack}:${POSTGRES_PASSWORD:-itstack_secure_password}@db:5432/${POSTGRES_DB:-itstack_db}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - SESSION_SECRET=${SESSION_SECRET:-itstack_production_secret_key_32bytes}
    volumes:
      - itstack-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/profiles"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - itstack-net

  # ----------------------------------------------------------------------------
  # 2. Database Service (PostgreSQL 16 Relational Engine)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: itstack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itstack_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-itstack_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itstack} -d ${POSTGRES_DB:-itstack_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - itstack-net

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  itstack-data:
    driver: local
  pgdata:
    driver: local

# ------------------------------------------------------------------------------
# Internal Bridge Network
# ------------------------------------------------------------------------------
networks:
  itstack-net:
    driver: bridge
