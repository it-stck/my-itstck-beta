version: "3.9"

services:
  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: itstck_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itstck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itstck_secret}
      POSTGRES_DB: ${POSTGRES_DB:-itstck}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itstck}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (for rate limiting / sessions) ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: itstck_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Next.js App ───────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itstck_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-itstck}:${POSTGRES_PASSWORD:-itstck_secret}@db:5432/${POSTGRES_DB:-itstck}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-itstck}:${POSTGRES_PASSWORD:-itstck_secret}@db:5432/${POSTGRES_DB:-itstck}?schema=public
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Nginx reverse proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: itstck_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro          # Mount SSL certs here
      - nginx_cache:/var/cache/nginx
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
  nginx_cache:
