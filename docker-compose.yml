services:
  itstack-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itstack-saas
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=https://my.itstck.com
    volumes:
      - itstack-data:/app/data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/profiles"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  itstack-data:
    driver: local
