services:
  # Application Service
  itstack-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itstack-saas
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=https://my.itstck.com
      - DATABASE_URL=postgres://itstack:itstack_secure_password@db:5432/itstack_db
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - SESSION_SECRET=${SESSION_SECRET:-changeme_production_secret_32bytes}
    volumes:
      - itstack-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/profiles"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - itstack-net

  # PostgreSQL Database Container
  db:
    image: postgres:16-alpine
    container_name: itstack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: itstack
      POSTGRES_PASSWORD: itstack_secure_password
      POSTGRES_DB: itstack_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itstack -d itstack_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - itstack-net

volumes:
  itstack-data:
    driver: local
  pgdata:
    driver: local

networks:
  itstack-net:
    driver: bridge
